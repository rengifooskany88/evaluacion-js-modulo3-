<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoServicios Machine - Bienvenidos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TecnoServicios Machine</h1>
        <p>Venta, reparación de máquinas caseras e industriales, y repuestos originales.</p>
    </header>

    <main>
        <section class="contacto-seccion">
            <h2>¡Contáctanos o salúdanos!</h2>
            <p>Escribe tu nombre para iniciar la atención personalizada:</p>

            <input type="text" id="nombreInput" placeholder="Ej. María Pérez">

            <button id="saludarBtn">Saludar</button>

            <p id="saludoResultado" class="resultado"></p>

            <p id="infoCaracteres" class="info-extra"></p>
        </section>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
